name: Release isolated oldtown aerial 3.6
on:
  push:
    branches: [aerial-release-3-6]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oldtown-static-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kokoom94-ai/jeju-oldtown-3d' && github.ref_name == 'aerial-release-3-6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed one-time source upgrade in this work branch
        run: |
          python scripts/upgrade-aerial-3-6.py
          python - <<'PY'
          from pathlib import Path
          old="const read=async n=>JSON.parse(await fs.readFile('precision/'+n,'utf8')).catch(()=>null);"
          new="const read=async n=>{try{return JSON.parse(await fs.readFile('precision/'+n,'utf8'));}catch{return null;}};"
          for name in ['scripts/upgrade-aerial-3-6.py','precision/release-summary.mjs']:
            p=Path(name);p.write_text(p.read_text().replace(old,new))
          PY
      - name: Test and build before publication
        id: unit
        run: |
          set -o pipefail
          mkdir -p precision-qa
          rm -f precision/*browser-result.json precision/readiness.json precision/publication.json precision/release-result.json
          npm test | tee precision-qa/unit-tests.txt
          npm run build
      - name: Save validated sources without touching another branch
        run: |
          git config user.name 'JEJU Oldtown release'
          git config user.email 'oldtown-release@users.noreply.github.com'
          git add package.json precision scripts
          if ! git diff --cached --quiet; then
            git commit -m 'Apply validated aerial 3.6 sources and clear stale QA [skip ci]'
            git push origin HEAD:refs/heads/aerial-release-3-6
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Stage only the isolated static branch
        id: publish
        run: node precision/publish.mjs
      - name: Record Pages availability independently of browser QA
        if: always()
        continue-on-error: true
        run: node precision/readiness.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install browser test dependencies
        id: browser
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.55.0
      - name: Verify diagnostic UI and key gates
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node precision/verify.cjs
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/browser
      - name: Verify local proxy failure fixtures, without deployment
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node precision/proxy-verify.cjs
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/browser
      - name: Verify current public bundle hashes and inspection controls
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node precision/inspection-verify.cjs
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/browser
      - name: Verify public aerial home on desktop and mobile
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: node precision/explore-verify.cjs
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/browser
      - name: Summarize this run only, without asserting precision
        if: always()
        run: node precision/release-summary.mjs
      - name: Save fresh reports in this work branch only
        if: always()
        run: |
          git add precision
          if ! git diff --cached --quiet; then
            git -c user.name='JEJU Oldtown release' -c user.email='oldtown-release@users.noreply.github.com' commit -m 'Record current aerial release tests and deployment limits [skip ci]'
            git push origin HEAD:refs/heads/aerial-release-3-6
          fi
      - name: Package reviewed sources only
        if: always()
        run: |
          python - <<'PYCODE'
          import subprocess, zipfile
          from pathlib import Path
          Path('precision-qa').mkdir(exist_ok=True)
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('precision-qa/jeju-before-3.6-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in files:
              if not name or not Path(name).is_file(): continue
              if Path(name).name.startswith('.env') and Path(name).name!='.env.example': continue
              z.write(name)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jeju-before-3.6-current-run
          path: |
            precision-qa/
            _precision_site/
            precision/*result.json
            precision/readiness.json
            precision/publication.json
          include-hidden-files: true
          retention-days: 14
