name: Validate and stage isolated Jeju oldtown 3D
on:
  push:
    branches: [jeju-before-web]
    paths:
      - 'precision/**'
      - 'scripts/**'
      - 'realism/**'
      - 'index.html'
      - 'real.html'
      - 'README.md'
      - '.github/workflows/oldtown-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oldtown-isolated-build
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'kokoom94-ai/jeju-oldtown-3d' && github.ref_name == 'jeju-before-web'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import pinned source once; never write to old repository
        run: python scripts/import-source.py
      - name: Verify unit and security contracts
        run: |
          set -o pipefail
          mkdir -p precision-qa
          npm test | tee precision-qa/unit-tests.txt
          npm run build
      - name: Commit validated imported source to development branch only
        run: |
          git config user.name 'JEJU Oldtown build'
          git config user.email 'oldtown-build@users.noreply.github.com'
          git add .gitignore package.json SOURCE.json index.html real.html precision realism
          if ! git diff --cached --quiet; then
            git commit -m 'Import isolated oldtown source and 3.3 configuration [skip ci]'
            git push origin HEAD:refs/heads/jeju-before-web
          fi
      - name: Stage static branch and validate no-key HTTPS preview
        run: node precision/publish.mjs
      - name: Probe actual Pages publication and both protected main branches
        if: always()
        run: node precision/readiness.mjs
      - name: Install Korean fonts and browser runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund playwright@1.55.0
      - name: Verify desktop mobile and no-key connection gate
        run: node precision/verify.cjs
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/browser
      - name: Verify keyless proxy failure and cancellation
        run: node precision/proxy-verify.cjs
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/browser
      - name: Verify live static hashes and new inspection controls
        run: node precision/inspection-verify.cjs
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/browser
      - name: Verify immersive explorer against current public preview and local failure fixture
        run: node precision/explore-verify.cjs
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/browser
      - name: Record this run only
        if: always()
        run: |
          git config user.name 'JEJU Oldtown build'
          git config user.email 'oldtown-build@users.noreply.github.com'
          for f in precision/publication.json precision/readiness.json precision/browser-result.json precision/proxy-browser-result.json precision/inspection-browser-result.json precision/explore-browser-result.json; do
            if test -f "$f"; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Record isolated oldtown deployment and QA status [skip ci]'
            git push origin HEAD:refs/heads/jeju-before-web
          fi
      - name: Package source excluding Git metadata and credentials
        if: always()
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('precision-qa/oldtown-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
            for p in sorted(Path('.').rglob('*')):
              if not p.is_file() or p.parts[0] in {'.git','_precision_site','precision-qa','node_modules'}: continue
              if p.name.startswith('.env') and p.name != '.env.example': continue
              z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jeju-oldtown-3d-3.5-qa
          path: |
            precision-qa/
            _precision_site/
            precision/readiness.json
            precision/publication.json
          include-hidden-files: true
          retention-days: 14
