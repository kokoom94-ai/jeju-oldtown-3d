name: Diagnose and recover dedicated Pages 404
on:
  push:
    branches: [jeju-precision-site]
    paths: ['.github/workflows/pages-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
concurrency:
  group: oldtown-pages-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'kokoom94-ai/jeju-oldtown-3d' && github.ref_name == 'jeju-precision-site'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check actual Pages settings, retry existing branch build, and verify public bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import os, json, time, hashlib, datetime
          from pathlib import Path
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          REPO='kokoom94-ai/jeju-oldtown-3d'
          BASE='https://kokoom94-ai.github.io/jeju-oldtown-3d/'
          assert os.environ['GITHUB_REPOSITORY']==REPO
          assert os.environ['GITHUB_REF_NAME']=='jeju-precision-site'
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener=build_opener(NoRedirect)
          def request(url, api=False, method='GET'):
              headers={'User-Agent':'JEJU-BEFORE-Pages-recovery','Cache-Control':'no-cache'}
              if api:
                  assert url.startswith('https://api.github.com/repos/'+REPO)
                  headers.update({'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with opener.open(Request(url,headers=headers,method=method),timeout=20) as r:
                      return r.status,r.read(4000000),r.headers.get('Content-Type','')
              except HTTPError as e: return e.code,e.read(20000),e.headers.get('Content-Type','')
              except Exception: return 0,b'', ''
          def api(suffix,method='GET'):
              status,body,_=request('https://api.github.com/repos/'+REPO+suffix,True,method)
              try: data=json.loads(body)
              except Exception: data={}
              return status,data
          report={'repository':REPO,'runId':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'], 'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'settingsChanged':False,'oldRepositoryWriteOperations':0,'actualKeyUsed':False}
          meta=json.loads(Path('site.json').read_text())
          assert meta['repository']==REPO and meta['siteBranch']=='jeju-precision-site'
          for p in ['index.html','connect.html','explore.mjs','site.json','.nojekyll']:
              assert Path(p).is_file(),p
          report['localEntryFilesPresent']=True
          rs,repo=api(''); ps,pages=api('/pages'); bs,build=api('/pages/builds/latest')
          report.update(repositoryApiCode=rs,repositoryHasPages=repo.get('has_pages'),pagesApiCode=ps,configuredSource=pages.get('source'),configuredUrl=pages.get('html_url'),buildType=pages.get('build_type'),latestBuildApiCode=bs,latestBuildStatus=build.get('status'))
          report['buildRequested']=False
          correct=ps==200 and pages.get('source')=={'branch':'jeju-precision-site','path':'/'} and pages.get('build_type','legacy')=='legacy' and not pages.get('cname')
          if correct and build.get('status') not in ['building','queued']:
              code,result=api('/pages/builds','POST')
              report['buildRequestCode']=code
              report['buildRequested']=code==201
          checks=[]
          for attempt in range(12 if correct else 1):
              checks=[]
              for name in ['','index.html','site.json','explore.mjs','connect.html']:
                  code,body,mime=request(BASE+name)
                  filename=name or 'index.html'
                  expected=hashlib.sha256(Path(filename).read_bytes()).hexdigest()
                  actual=hashlib.sha256(body).hexdigest()
                  allowed=('text/html',) if filename.endswith('.html') else ('application/json',) if filename.endswith('.json') else ('application/javascript','text/javascript')
                  matches=code==200 and actual==expected and mime.split(';')[0].strip() in allowed
                  checks.append({'path':name or '/', 'httpStatus':code,'contentType':mime,'matchesPublishedFiles':matches})
              if all(c['matchesPublishedFiles'] for c in checks): break
              if attempt+1 < (12 if correct else 1): time.sleep(5)
          report['publicChecks']=checks
          report['siteVerified']=all(c['matchesPublishedFiles'] for c in checks)
          if report['siteVerified']: report['result']='PUBLIC_SITE_VERIFIED'
          elif ps==404 and rs==200 and repo.get('has_pages') is False: report['result']='PAGES_NOT_ENABLED'
          elif ps!=200: report['result']='PAGES_SETTINGS_UNAVAILABLE'
          elif not correct: report['result']='PAGES_SOURCE_REQUIRES_OWNER_REVIEW'
          else: report['result']='BUILD_OR_PUBLICATION_FAILED'
          out=Path(os.environ['RUNNER_TEMP'])/'oldtown-pages-recovery.json'
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## JEJU:BEFORE Pages recovery\n\n```json\n'+json.dumps(report,ensure_ascii=False,indent=2)+'\n```\n')
          if not report['siteVerified']: raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oldtown-pages-recovery
          path: ${{ runner.temp }}/oldtown-pages-recovery.json
          retention-days: 7
