name: Publish and verify SDK fix 3.7.1
on:
  push:
    branches: ['fix/sdk-bootstrap-3-7-1']
    paths: ['.github/workflows/sdk-fix-release.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: oldtown-sdk-fix-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'kokoom94-ai/jeju-oldtown-3d' && github.ref_name == 'fix/sdk-bootstrap-3-7-1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-run tests and build reviewed source
        run: |
          set -o pipefail
          mkdir -p precision-qa
          npm test | tee precision-qa/sdk-unit-tests.txt
          npm run build
          python -m pip install --disable-pip-version-check playwright==1.55.0
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          python scripts/sdk-browser-regression.py
      - name: Fast-forward only the existing isolated static branch
        run: python scripts/deploy-sdk-fix.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Inspect actual dedicated HTTPS page in desktop and mobile Chromium
        run: python scripts/verify-sdk-public.py
      - name: Record actual result and never claim provider validation
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,datetime,os,re,zipfile
          root=Path('precision-qa');root.mkdir(exist_ok=True)
          def read(n):return json.loads((root/n).read_text()) if (root/n).is_file() else None
          text=(root/'sdk-unit-tests.txt').read_text() if (root/'sdk-unit-tests.txt').is_file() else ''
          def number(n):
            m=re.search(r'^# '+n+r' (\d+)$',text,re.M);return int(m.group(1)) if m else None
          report={'version':'3.7.1-sdk-diagnostics','checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],'unit':{'passed':number('pass'),'failed':number('fail')},'fixtureBrowser':read('sdk-regression.json'),'publicBrowser':read('sdk-public.json'),'deployment':read('sdk-deploy.json'),'actualKeyUsed':False,'sdkLiveTested':False,'jejuPrecisionModelsReceived':False,'geometryVerified':False,'productionReady':False,'scope':'Source fixes, explicit mocked bootstrap regression and dedicated public page. No user key or real provider geometry.'}
          Path('precision/sdk-fix-result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2));(root/'sdk-fix-result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          with zipfile.ZipFile(root/'sdk-fix-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('.').rglob('*'):
              if not p.is_file() or p.parts[0] in {'.git','_precision_site','precision-qa','node_modules'}:continue
              if p.name.startswith('.env') and p.name!='.env.example':continue
              z.write(p)
          PY
          git config user.name 'JEJU Oldtown build'
          git config user.email 'oldtown-build@users.noreply.github.com'
          git add precision/sdk-fix-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record SDK fix verification with live provider unverified [skip ci]'
            git push origin HEAD:refs/heads/fix/sdk-bootstrap-3-7-1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-fix-release
          path: precision-qa/
          retention-days: 7
