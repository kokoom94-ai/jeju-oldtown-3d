name: Verify real mouse input and publish oldtown 3.8
on:
  push:
    branches: [release/visitor-3-8]
    paths: ['precision/**', 'scripts/**', '.github/workflows/visitor-ci.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: oldtown-visitor-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kokoom94-ai/jeju-oldtown-3d' && github.ref_name == 'release/visitor-3-8'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate reviewed existing source without any provider credential
        run: python scripts/upgrade-visitor-ui.py
      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p precision-qa
          npm run build
          npm test | tee precision-qa/visitor-unit.txt
      - name: Install browser test dependencies only
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          npm install --prefix "$RUNNER_TEMP/cesium" --no-audit --no-fund cesium@1.121.0
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Actual mouse revolutions on Three.js and real Cesium with explicit SDK fixtures
        run: python scripts/verify-visitor-browser.py
        env:
          TEST_CESIUM_ROOT: ${{ runner.temp }}/cesium
      - name: Commit integrated readable source on this branch only
        run: |
          git config user.name 'JEJU Oldtown build'
          git config user.email 'oldtown-build@users.noreply.github.com'
          git add .gitignore package.json precision scripts
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate tested 360 pointer controls and street mode [skip ci]'
            git push origin HEAD:refs/heads/release/visitor-3-8
          fi
      - name: Publish tested bundle to existing Pages branch
        run: python scripts/publish-visitor.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Repeat pointer tests on actual public HTTPS URL
        run: python scripts/verify-visitor-browser.py
        env:
          TEST_CESIUM_ROOT: ${{ runner.temp }}/cesium
          VERIFY_BASE_URL: https://kokoom94-ai.github.io/jeju-oldtown-3d/
      - name: Record this attempt, including failures
        if: always()
        run: |
          python - <<'PY'
          import json,re,os,datetime,subprocess
          from pathlib import Path
          root=Path('precision-qa');root.mkdir(exist_ok=True)
          def read(n):return json.loads((root/n).read_text()) if (root/n).is_file() else None
          text=(root/'visitor-unit.txt').read_text() if (root/'visitor-unit.txt').is_file() else ''
          def num(n):
            m=re.search(r'^# '+n+r' (\d+)$',text,re.M);return int(m.group(1)) if m else None
          result={'version':'3.8.0-visitor-navigation','runId':os.environ['GITHUB_RUN_ID'],'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'unit':{'passed':num('pass'),'failed':num('fail')},'candidateBrowser':read('visitor-candidate.json'),'publicBrowser':read('visitor-public.json'),'deployment':read('visitor-deployment.json'),'actualKeyUsed':False,'publisherKeyConfigured':False,'geometryVerified':False,'walkingProductionReady':False,'productionReady':False,'oldRepositoryWriteOperations':0}
          Path('precision/visitor-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));(root/'visitor-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          git config user.name 'JEJU Oldtown build'
          git config user.email 'oldtown-build@users.noreply.github.com'
          git add precision/visitor-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record actual 3.8 mouse and deployment results [skip ci]'
            git push origin HEAD:refs/heads/release/visitor-3-8
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oldtown-visitor-mouse-tests
          path: precision-qa/
          retention-days: 7
