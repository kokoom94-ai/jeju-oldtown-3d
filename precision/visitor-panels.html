<dialog id="walk-dialog"><div class="panel-heading"><h2>캐릭터·거리 시점 β</h2><button id="walk-close" aria-label="거리 시점 닫기">×</button></div><p>원본 지형 위에서 캐릭터를 따라가거나 눈높이로 건물 정면을 봅니다. 드래그로 360° 시선을 돌립니다.</p><p class="callout">원도심 일부 보행 중심선에 한정한 실험입니다. 실제 출입 허가·건물 완전성·보행 안전은 검증 전입니다. 공항·활주로·계류장은 보행 대상에서 제외합니다.</p><p>지형 또는 표면 정보를 받지 못한 곳, 건물 윤곽, 보행선 밖과 큰 단차에서는 이동을 멈춥니다.</p><p id="walk-start-status" role="status"></p><button id="walk-confirm" class="accent">거리 시점 시작</button></dialog>
